# On every push to main: run tests, then build and push a container to GHCR tagged with a
# short git SHA (7 chars) and the moving nightly tag.
name: Nightly (main)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  git_meta:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - id: sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/reusable-go-test.yml
    secrets: inherit

  image:
    needs: [git_meta, test]
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      version: ${{ needs.git_meta.outputs.short_sha }}
      push: true
      tag_latest: false
      extra_tag_suffixes: nightly
    secrets: inherit
