# Reusable: run Go unit and integration tests (`go test ./...`).
# Call from CI (PR/main), release, or other workflows via workflow_call.
name: Reusable — Go test

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version
        type: string
        required: false
        default: "1.24.x"
      checkout-fetch-depth:
        description: git fetch-depth for checkout
        type: number
        required: false
        default: 1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ inputs.checkout-fetch-depth }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: go.sum

      - run: go test ./...
