name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Untrusted comments must not receive a write token. The job below
# overrides these only when the author check passes and the job runs.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      github.event.comment.author_association == 'OWNER' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          LLMATE_API_KEY: ${{ secrets.LLMATE_API_KEY }}
          LLMATE_BASE_URL: ${{ secrets.LLMATE_BASE_URL }}
          OPENCODE_CONFIG: .github/workflows/opencode.json
        with:
          model: llmate/Github
          # share: true
