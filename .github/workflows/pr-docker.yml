# Pull requests targeting main or rc: verify the Docker image builds for
# linux/amd64 and linux/arm64. Does not push to GHCR.
name: PR — Docker build

on:
  pull_request:
    branches: [main, rc]

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  image:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      version: pr-${{ github.event.pull_request.number }}
      version_embed: 0.0.0-pr.${{ github.event.pull_request.number }}
      push: false
      tag_latest: false
      platforms: linux/amd64,linux/arm64
      cache_scope: pr
