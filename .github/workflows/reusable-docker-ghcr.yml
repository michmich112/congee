# Reusable: build the project Docker image; optionally push to GHCR.
# Use push=false to verify the Dockerfile on PRs; push=true for release or nightly images.
name: Reusable — Docker build (GHCR)

on:
  workflow_call:
    inputs:
      version:
        description: Docker VERSION build-arg and primary image tag (no leading v)
        type: string
        required: true
      push:
        description: Push image to ghcr.io after build
        type: boolean
        required: false
        default: false
      tag_latest:
        description: Also tag and push latest (only when push is true)
        type: boolean
        required: false
        default: false
      image_name:
        description: Full image name (lowercase). Empty = ghcr.io/<owner>/<repo>
        type: string
        required: false
        default: ""
      platforms:
        description: e.g. linux/amd64 or linux/amd64,linux/arm64
        type: string
        required: false
        default: linux/amd64
    outputs:
      image_digest:
        description: Image digest when build completes (empty if unavailable)
        value: ${{ jobs.docker.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image name (lowercase)
        id: img
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            echo "name=${{ inputs.image_name }}" >> "$GITHUB_OUTPUT"
          else
            lower="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            echo "name=ghcr.io/${lower}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose tags
        id: tags
        run: |
          BASE="${{ steps.img.outputs.name }}"
          {
            echo "lines<<TAG_EOF"
            echo "${BASE}:${{ inputs.version }}"
            if [ "${{ inputs.tag_latest }}" = "true" ]; then
              echo "${BASE}:latest"
            fi
            echo "TAG_EOF"
          } >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            VERSION=${{ inputs.version }}
          tags: ${{ steps.tags.outputs.lines }}
